name: CI/CD

# triggers: run on every push and every pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest       # free GitHub-hosted Linux VM

    steps:
      # Step 1: check out the repo code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: install Java 21 on the runner
      # (we use 21 here instead of 25 because GitHub's runners
      #  support Java 21 LTS out of the box via Temurin)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: cache Maven dependencies
      # so GitHub doesn't re-download Spring Boot on every run
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Step 4: compile and run all JUnit tests
      - name: Build and test
        working-directory: backend
        run: mvn test

  deploy:
    name: Deploy backend to Cloud Run
    needs: build-and-test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: stampede-510308
      REGION: asia-south1
      ARTIFACT_REPOSITORY: stampede
      SERVICE_NAME: stampede-backend
      INSTANCE_CONNECTION_NAME: stampede-510308:asia-south1:stampede-db
      RUNTIME_SERVICE_ACCOUNT: stampede-runtime@stampede-510308.iam.gserviceaccount.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          docker build --file backend/Dockerfile --tag "$IMAGE" backend
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --add-cloudsql-instances "$INSTANCE_CONNECTION_NAME" \
            --set-env-vars "DB_URL=jdbc:postgresql:///stampede?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory,DB_USERNAME=stampede_app" \
            --set-env-vars "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --set-secrets "JWT_PRIVATE_KEY=jwt-private-key:latest" \
            --quiet

  deploy-frontend:
    name: Deploy frontend to Cloud Run
    needs: deploy
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: stampede-510308
      REGION: asia-south1
      ARTIFACT_REPOSITORY: stampede
      SERVICE_NAME: stampede-frontend
      RUNTIME_SERVICE_ACCOUNT: stampede-runtime@stampede-510308.iam.gserviceaccount.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push frontend image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          docker build --file frontend/Dockerfile --tag "$IMAGE" frontend
          docker push "$IMAGE"

      - name: Deploy frontend to Cloud Run
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --port 8080 \
            --quiet

      - name: Publish frontend URL
        run: |
          FRONTEND_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --format="value(status.url)")
          echo "Frontend URL: $FRONTEND_URL"
          {
            echo "### Frontend deployment"
            echo
            echo "Frontend URL: $FRONTEND_URL"
          } >> "$GITHUB_STEP_SUMMARY"
