server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://stampede-backend-6jatj5ld7a-el.a.run.app;
        proxy_ssl_server_name on;
        proxy_set_header Host stampede-backend-6jatj5ld7a-el.a.run.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}